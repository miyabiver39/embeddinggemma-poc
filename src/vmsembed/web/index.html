<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vmsembed 開発用WebUI</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1d2129; --card:#fff; --line:#d9dde3; --acc:#2563eb; --mute:#6b7280; --ok:#16a34a; --ng:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e5e7eb; --card:#1e2127; --line:#343a43; --acc:#60a5fa; --mute:#9ca3af; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .badge { font-size:12px; color:var(--mute); }
  nav { display:flex; gap:4px; padding:8px 16px 0; }
  nav button { border:1px solid var(--line); border-bottom:none; background:var(--bg); color:var(--fg); padding:6px 16px; border-radius:6px 6px 0 0; cursor:pointer; }
  nav button.on { background:var(--card); font-weight:600; color:var(--acc); }
  main { padding:0 16px 32px; }
  section { display:none; background:var(--card); border:1px solid var(--line); border-radius:0 6px 6px 6px; padding:16px; }
  section.on { display:block; }
  label { display:inline-flex; flex-direction:column; font-size:12px; color:var(--mute); gap:2px; margin:0 12px 8px 0; }
  input, select, textarea, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:5px 8px; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); cursor:pointer; }
  button:disabled { opacity:.5; }
  .row { display:flex; flex-wrap:wrap; align-items:flex-end; }
  .grow { flex:1 1 320px; } .grow input { width:100%; }
  .hits { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-top:12px; }
  .hit { border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--bg); cursor:pointer; }
  .hit img { width:100%; aspect-ratio:16/9; object-fit:cover; background:#000; display:block; }
  .hit .meta { padding:6px 8px; font-size:12px; }
  .score { font-weight:700; color:var(--acc); }
  .mute { color:var(--mute); }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .st-done { color:var(--ok); } .st-failed { color:var(--ng); }
  video { width:100%; max-height:60vh; background:#000; margin-top:12px; }
  pre { background:var(--bg); border:1px solid var(--line); padding:8px; overflow:auto; border-radius:4px; }
  .note { font-size:12px; color:var(--mute); margin:6px 0 12px; }
  .err { color:var(--ng); white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>vmsembed <span class="badge">開発用WebUI(認証なし・自己責任)</span></h1>
  <span class="badge" id="hdr">読み込み中…</span>
</header>
<nav id="tabs">
  <button data-t="search" class="on">検索</button>
  <button data-t="ingest">取り込み</button>
  <button data-t="jobs">ジョブ・ソース</button>
  <button data-t="status">状態</button>
</nav>
<main>
<!-- ============ 検索 ============ -->
<section id="search" class="on">
  <div class="row">
    <label class="grow">検索ワード(テキスト)<input id="q" placeholder="例: 赤い車 / 人が走っている / サイレンの音"></label>
    <button class="primary" id="btn-text" style="margin-bottom:8px">検索</button>
  </div>
  <div class="row">
    <label>画像で検索<input type="file" id="qimg" accept="image/*"></label>
    <label>音声で検索<input type="file" id="qaud" accept="audio/*"></label>
  </div>
  <div class="row">
    <label>種別<select id="f-kind">
      <option value="auto">auto(設定に合わせ frames か tav。音声検索は audio)</option>
      <option value="all">all(全て)</option>
      <option value="frames">frames(映像のみ)</option>
      <option value="tav">tav(映像+音声)</option>
      <option value="audio">audio(音声のみ)</option></select></label>
    <label>件数<input id="f-topk" type="number" min="1" value="10" style="width:70px"></label>
    <label>最小スコア<input id="f-min" type="number" step="0.01" value="0" style="width:80px"></label>
    <label>カメラID<input id="f-cam" style="width:120px"></label>
    <label>場所<input id="f-loc" style="width:120px"></label>
    <label>開始日時<input id="f-from" type="datetime-local"></label>
    <label>終了日時<input id="f-to" type="datetime-local"></label>
    <label>連続区間をまとめる<select id="f-merge"><option value="true">する</option><option value="false">しない</option></select></label>
  </div>
  <div class="note">スコアはコサイン類似度です。テキスト→映像の一致は 0.3〜0.5 程度でも十分に意味があることがあります(最小スコアは実データを見て調整してください)。</div>
  <div id="s-msg" class="mute"></div>
  <div class="hits" id="hits"></div>
  <video id="player" controls style="display:none"></video>
</section>

<!-- ============ 取り込み ============ -->
<section id="ingest">
  <h3 style="margin-top:0">共通の設定</h3>
  <div class="row">
    <label>カメラID<input id="i-cam"></label>
    <label>場所<input id="i-loc"></label>
    <label>録画開始日時(空なら現在)<input id="i-ts" type="datetime-local"></label>
    <label>プリセット<select id="i-preset"><option value="">(既定)</option></select></label>
    <label>窓の長さ(秒)<input id="i-win" type="number" min="1" style="width:80px"></label>
    <label>窓あたりのフレーム数<input id="i-fr" type="number" min="1" style="width:80px"></label>
    <label>重なり(秒)<input id="i-ov" type="number" min="0" style="width:80px"></label>
    <label>音声を含める<select id="i-aud"><option value="">(既定)</option><option value="true">含める</option><option value="false">含めない</option></select></label>
  </div>
  <div class="note" id="i-note"></div>

  <h3>ファイルをアップロード</h3>
  <div class="row">
    <label>動画<input type="file" id="i-vfile" accept="video/*"></label>
    <button id="btn-vup" class="primary" style="margin-bottom:8px">動画を取り込む</button>
    <label style="margin-left:24px">音声<input type="file" id="i-afile" accept="audio/*"></label>
    <button id="btn-aup" class="primary" style="margin-bottom:8px">音声を取り込む</button>
  </div>

  <h3>コンテナ内のパスを指定(録画ディレクトリをマウントして使う)</h3>
  <div class="row">
    <label class="grow">パス(コンテナ内)<input id="i-path" placeholder="/recordings/cam01/20260101_000000.mp4"></label>
    <label>種類<select id="i-pkind"><option>video</option><option>audio</option></select></label>
    <button id="btn-path" class="primary" style="margin-bottom:8px">取り込む</button>
  </div>
  <div id="i-msg"></div>
</section>

<!-- ============ ジョブ ============ -->
<section id="jobs">
  <div class="row"><button id="btn-refresh">更新</button><label style="margin:0 0 0 12px"><input type="checkbox" id="auto" checked> 自動更新(3秒)</label></div>
  <h3>ジョブ</h3>
  <table id="t-jobs"></table>
  <h3>ソース</h3>
  <table id="t-src"></table>
</section>

<!-- ============ 状態 ============ -->
<section id="status">
  <pre id="info"></pre>
  <div class="note">API 仕様は <a href="/docs" target="_blank">/docs</a>(Swagger UI)にあります。</div>
</section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (ms) => { const t = Math.floor(ms/1000), h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return (h ? h+":"+String(m).padStart(2,"0") : m)+":"+String(s).padStart(2,"0"); };
// datetime-local はブラウザのローカル時刻。サーバ側は ISO 文字列を解釈する
const tsOrEmpty = (id) => $(id).value ? $(id).value : "";

// ---- タブ
document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll("section").forEach((x) => x.classList.toggle("on", x.id === b.dataset.t));
  if (b.dataset.t === "jobs") loadJobs(); if (b.dataset.t === "status") loadInfo();
});

async function api(path, opts) {
  const r = await fetch(path, opts);
  let body = null; try { body = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error((body && body.detail ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) : r.statusText) + " (HTTP " + r.status + ")");
  return body;
}

// ---- 状態
let INFO = null;
async function loadInfo() {
  try {
    INFO = await api("/api/info");
    $("info").textContent = JSON.stringify(INFO, null, 2);
    const e = INFO.embedder || {};
    $("hdr").textContent = e.error ? "埋め込み: 接続エラー" :
      `${e.backend} / ${e.model_id} / ${e.dims}次元 / ${e.accelerator} (${e.device}, ${e.dtype}) / 窓 ${INFO.index.windows ?? "-"}`;
    const sel = $("i-preset");
    if (sel.options.length === 1) Object.keys(INFO.presets || {}).forEach((k) => sel.add(new Option(k, k)));
    const d = INFO.defaults || {};
    $("i-note").textContent = `未指定の項目は既定値: 窓 ${d.window_sec}秒 / ${d.frames_per_window}フレーム / 重なり ${d.overlap_sec}秒 / 音声 ${d.include_audio ? "あり" : "なし"}。プリセット: ` +
      Object.entries(INFO.presets || {}).map(([k, v]) => k + "=" + JSON.stringify(v)).join(" ");
  } catch (e) { $("hdr").textContent = "情報取得エラー: " + e.message; }
}

// ---- 検索
function filters() {
  return { top_k: +$("f-topk").value || null, min_score: +$("f-min").value || 0, camera_id: $("f-cam").value || null,
    location: $("f-loc").value || null, from_ts: tsOrEmpty("f-from") || null, to_ts: tsOrEmpty("f-to") || null,
    kind: $("f-kind").value, merge: $("f-merge").value === "true" };
}
function formFilters(fd) {
  const f = filters();
  for (const [k, v] of Object.entries(f)) if (v !== null && v !== "") fd.append(k, v);
  return fd;
}
async function runSearch(kind) {
  $("s-msg").textContent = "検索中…"; $("s-msg").className = "mute"; $("hits").innerHTML = "";
  try {
    let res;
    if (kind === "text") {
      if (!$("q").value.trim()) throw new Error("検索ワードを入力してください");
      res = await api("/api/search/text", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query: $("q").value, ...filters() }) });
    } else {
      const file = $(kind === "image" ? "qimg" : "qaud").files[0];
      if (!file) throw new Error("ファイルを選んでください");
      const fd = new FormData(); fd.append("file", file); formFilters(fd);
      res = await api("/api/search/" + kind, { method: "POST", body: fd });
    }
    renderHits(res);
  } catch (e) { $("s-msg").textContent = e.message; $("s-msg").className = "err"; }
}
function renderHits(res) {
  const items = res.intervals || res.results.map((r) => ({ ...r, window_ids: [r.window_id] }));
  const byWin = Object.fromEntries(res.results.map((r) => [r.window_id, r]));
  $("s-msg").textContent = `${items.length} 件(${res.took_ms} ms, 対象種別: ${res.searched_kinds})`;
  $("hits").innerHTML = items.map((it, i) => {
    const first = byWin[it.window_ids[0]] || {};
    const thumb = first.thumb_url || "";
    return `<div class="hit" data-i="${i}">
      <img loading="lazy" src="${esc(thumb)}" alt="">
      <div class="meta"><span class="score">${it.score.toFixed(3)}</span>
      ${esc(it.source_name)} ${fmt(it.start_ms)}–${fmt(it.end_ms)}<br>
      <span class="mute">${esc(it.camera_id || "")} ${esc(it.location || "")} ${esc(first.abs_time || "")} ${first.kind ? "["+esc(first.kind)+"]" : ""}</span></div></div>`;
  }).join("");
  document.querySelectorAll(".hit").forEach((el) => el.onclick = () => {
    const it = items[+el.dataset.i], url = (byWin[it.window_ids[0]] || {}).media_url;
    if (!url) return;
    const p = $("player"); p.style.display = "block";
    p.src = url + "#t=" + (it.start_ms / 1000).toFixed(2); p.play().catch(() => {});
    p.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
}
$("btn-text").onclick = () => runSearch("text");
$("q").onkeydown = (e) => { if (e.key === "Enter") runSearch("text"); };
$("qimg").onchange = () => $("qimg").files[0] && runSearch("image");
$("qaud").onchange = () => $("qaud").files[0] && runSearch("audio");

// ---- 取り込み
function ingestFields(fd) {
  const m = { camera_id: "i-cam", location: "i-loc", start_ts: "i-ts", preset: "i-preset", window_sec: "i-win",
    frames_per_window: "i-fr", overlap_sec: "i-ov", include_audio: "i-aud" };
  for (const [k, id] of Object.entries(m)) if ($(id).value) fd.append(k, $(id).value);
  return fd;
}
async function ingest(kind) {
  const file = $(kind === "video" ? "i-vfile" : "i-afile").files[0];
  if (!file) { $("i-msg").innerHTML = '<span class="err">ファイルを選んでください</span>'; return; }
  $("i-msg").textContent = "アップロード中…";
  try {
    const fd = ingestFields(new FormData()); fd.append("file", file);
    if (kind === "audio") { fd.delete("preset"); fd.delete("window_sec"); fd.delete("frames_per_window"); fd.delete("overlap_sec"); fd.delete("include_audio"); }
    const r = await api("/api/ingest/" + kind, { method: "POST", body: fd });
    $("i-msg").textContent = `受け付けました: source_id=${r.source_id}, job_id=${r.job_id}(「ジョブ・ソース」タブで進捗を確認)`;
  } catch (e) { $("i-msg").innerHTML = '<span class="err">' + esc(e.message) + "</span>"; }
}
$("btn-vup").onclick = () => ingest("video");
$("btn-aup").onclick = () => ingest("audio");
$("btn-path").onclick = async () => {
  const body = { path: $("i-path").value, kind: $("i-pkind").value };
  const m = { camera_id: "i-cam", location: "i-loc", start_ts: "i-ts", preset: "i-preset" };
  for (const [k, id] of Object.entries(m)) if ($(id).value) body[k] = $(id).value;
  for (const [k, id] of Object.entries({ window_sec: "i-win", frames_per_window: "i-fr", overlap_sec: "i-ov" })) if ($(id).value) body[k] = +$(id).value;
  if ($("i-aud").value) body.include_audio = $("i-aud").value === "true";
  try {
    const r = await api("/api/ingest/path", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    $("i-msg").textContent = `受け付けました: source_id=${r.source_id}, job_id=${r.job_id}`;
  } catch (e) { $("i-msg").innerHTML = '<span class="err">' + esc(e.message) + "</span>"; }
};

// ---- ジョブ・ソース
async function loadJobs() {
  try {
    const [j, s] = await Promise.all([api("/api/jobs"), api("/api/sources")]);
    $("t-jobs").innerHTML = "<tr><th>ID</th><th>ソース</th><th>状態</th><th>進捗</th><th>エラー</th></tr>" + j.jobs.map((x) =>
      `<tr><td>${x.id}</td><td>${esc(x.source_name)}</td><td class="st-${esc(x.status)}">${esc(x.status)}</td><td>${x.progress}/${x.total}</td><td class="err">${esc(x.error || "")}</td></tr>`).join("");
    $("t-src").innerHTML = "<tr><th>ID</th><th>名前</th><th>種類</th><th>カメラ</th><th>場所</th><th>窓数</th><th>状態</th><th></th></tr>" + s.sources.map((x) =>
      `<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.kind)}</td><td>${esc(x.camera_id || "")}</td><td>${esc(x.location || "")}</td><td>${x.window_count}</td><td class="st-${esc(x.status)}">${esc(x.status)}</td>
      <td><button data-re="${x.id}">再取り込み</button> <button data-del="${x.id}">削除</button></td></tr>`).join("");
    document.querySelectorAll("[data-re]").forEach((b) => b.onclick = async () => { await api(`/api/sources/${b.dataset.re}/reindex`, { method: "POST" }); loadJobs(); });
    document.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
      if (confirm("ソース " + b.dataset.del + " と、そのベクトルを削除します。よろしいですか?")) { await api(`/api/sources/${b.dataset.del}`, { method: "DELETE" }); loadJobs(); }
    });
  } catch (e) { $("t-jobs").innerHTML = '<tr><td class="err">' + esc(e.message) + "</td></tr>"; }
}
$("btn-refresh").onclick = loadJobs;
setInterval(() => { if ($("jobs").classList.contains("on") && $("auto").checked) loadJobs(); }, 3000);

loadInfo();
</script>
</body>
</html>
