# mediasearch への中継。server_name と証明書のパスを、利用する環境に合わせて書き換えてください。
# アプリ側には、次の環境変数を設定します(deploy/compose.nginx.yml を参照)。
#   FORWARDED_ALLOW_IPS  Nginx からの X-Forwarded-For / X-Forwarded-Proto を信用する(送信元の IP をログに残す)
#   ALLOWED_HOSTS        下の server_name と同じホスト名(DNS リバインディング対策)
#   PUBLIC_URL           https://<server_name>(通知の Webhook の本文の URL を絶対 URL にする)
#   MAX_UPLOAD_MB        下の client_max_body_size と同じ値

upstream mediasearch {
    server mediasearch:8000;  # compose のサービス名。Nginx を直接ホストで動かす場合は 127.0.0.1:8000
    keepalive 32;
}

# ---- Nginx 自身の死活監視(コンテナの healthcheck 用。外からは接続できない)
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /health {
        return 200 "ok\n";
    }
}

# ---- HTTP: HTTPS へ転送する(Let's Encrypt の HTTP-01 の確認だけは HTTP のまま答える)
server {
    listen 80;
    # listen [::]:80;  # IPv6 を使う場合(Docker の既定のネットワークは IPv6 が無効で、有効にすると起動に失敗する)
    server_name search.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS
server {
    listen 443 ssl;
    # listen [::]:443 ssl;  # IPv6 を使う場合
    http2 on;
    server_name search.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    include /etc/nginx/snippets/security-headers.conf;

    # アップロード(動画は数 GB になる)。アプリの MAX_UPLOAD_MB と同じ値にする(超えると Nginx が 413 を返す)
    client_max_body_size 4096m;
    client_body_timeout 300s;

    # 1 つの送信元からの同時接続(SSE と MCP の接続を含む)
    limit_conn ms_conn 50;

    # ---- 取り込み(アップロード): 本文を Nginx の一時ファイルにためずに、受け取りながらアプリへ渡す
    # (ためると、数 GB の動画をディスクに 2 回書くことになり、アプリが受け取り始めるのも遅れる)
    location /api/ingest/ {
        limit_req zone=ms_api burst=20 nodelay;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- リアルタイム検索(SSE): ためずにすぐ流す。接続は最大 duration_sec(既定 1 時間)続く。
    # アプリは 15 秒ごとに keep-alive を送るため、読み取りの待ち時間はそれより十分長ければよい
    location = /api/search/live {
        limit_req zone=ms_search burst=10 nodelay;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- 検索: 推論を使うため、送信元ごとの上限を厳しくする
    location /api/search/ {
        limit_req zone=ms_search burst=20 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- 元の動画・音声の配信(Range 対応。頭出し再生)。大きいファイルを Nginx の一時ファイルにためずに流す
    location /api/media/ {
        limit_req zone=ms_api burst=50 nodelay;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- MCP(Streamable HTTP)。応答を SSE で返すことがあるため、ためずに流す
    location = /mcp {
        limit_req zone=ms_api burst=20 nodelay;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- 監視の値(Prometheus)。内部のネットワークからだけ読めるようにする(アプリ側でもトークンが必要)
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- バックアップ: 作成は DB 全体を写すため、時間がかかることがある
    location /api/admin/ {
        # 管理の操作を内部のネットワークに限る場合は、/metrics と同じ allow / deny を書く
        limit_req zone=ms_api burst=5 nodelay;
        proxy_read_timeout 1h;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- 死活監視・準備完了の確認は上限の対象外(ロードバランサー・監視からの定期的な確認を断らない)
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /readyz {
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- そのほか(WebUI・API・API 仕様の画面)
    location / {
        limit_req zone=ms_api burst=100 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }
}
