# mediasearch の前段に置く Nginx の設定(本体)。
# 中継の設定は conf.d/mediasearch.conf、共通のヘッダーは snippets/ にあります。説明は docs/nginx.md を参照してください。
# 公式イメージ nginx:1.28-alpine で確認しています(http2 の書き方は 1.25.1 以降)。

user nginx;
worker_processes auto;
# 1 つの中継は、利用者側と上流側の 2 つのファイル記述子を使うため、worker_connections の 2 倍にする
# (Docker の既定の上限より小さい値にしてある。上限より大きいと、引き上げに失敗した警告が出る)
worker_rlimit_nofile 16384;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    # SSE(リアルタイム検索)と MCP は接続を長く保つため、同時接続の上限を大きめにする
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;  # 応答の Server ヘッダーに版を出さない
    charset utf-8;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;

    # ---- リクエスト ID: 受け取った X-Request-ID(英数字・-・_ の 64 文字まで)があればそれを、無ければ Nginx が作った値を使う。
    # アプリに渡し、アプリの応答とログ(LOG_FORMAT=json の request_id)、Nginx のログで同じ値になる
    map $http_x_request_id $req_id {
        "~^[A-Za-z0-9_-]{1,64}$" $http_x_request_id;
        default $request_id;
    }

    # ---- アクセスログ(1 行 1 件の JSON。アプリの LOG_FORMAT=json と突き合わせやすいように)。
    # トークンを含むヘッダー(Authorization・X-API-Key)と、クエリ文字列は残さない($uri はクエリを含まない)
    log_format mediasearch_json escape=json
        '{"time":"$time_iso8601","request_id":"$req_id","client":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status","protocol":"$server_protocol","user_agent":"$http_user_agent"}';
    access_log /dev/stdout mediasearch_json;

    # ---- 圧縮: JSON・WebUI・Prometheus の値。画像・動画は圧縮済みなので対象外。
    # SSE(text/event-stream)は、圧縮するとためてから送ることになり通知が遅れるため対象外
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

    # ---- 送信元ごとの上限(429 で断る)。検索は推論を使うため、ほかの API より厳しくする。
    # アプリ側にも同時に処理する検索の上限(MAX_PENDING_SEARCHES、503)があり、こちらは 1 つの送信元による独占を防ぐ
    limit_req_zone $binary_remote_addr zone=ms_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ms_search:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=ms_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ---- 中継の既定値(長い処理・大きいファイルに合わせる)
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;  # CPU の推論では、取り込み中の検索が 10 秒以上待つことがある
    proxy_buffers 16 64k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;

    # ---- TLS(Mozilla の intermediate 相当。TLS 1.2 / 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/*.conf;
}
