# mediasearch に中継するときの共通の設定(各 location で include する)。
proxy_pass http://mediasearch;
proxy_http_version 1.1;
proxy_set_header Connection "";  # 上流との接続を使い回す(upstream の keepalive)

# Host はポートを含めてそのまま渡す。アプリは、別サイトからの更新系リクエストの判定(CSRF)で
# Origin と Host を比べ、ALLOWED_HOSTS で Host を確かめるため、書き換えると正しい要求も 403 になる
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;  # 受け取った値は引き継がない(送信元が偽れないように)
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Request-ID $req_id;
# アプリの応答の X-Request-ID は隠し、Nginx が全ての応答(429・502 など Nginx が返すものを含む)に付ける(同じ値)
proxy_hide_header X-Request-ID;
