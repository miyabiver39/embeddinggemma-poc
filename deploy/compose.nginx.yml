# Nginx を前段に置く構成(HTTPS の終端・送信元ごとの上限・アクセスログ)。説明は docs/nginx.md を参照してください。
#   1. deploy/nginx/conf.d/mediasearch.conf の server_name を、利用するホスト名に書き換える
#   2. 証明書を deploy/nginx/certs/fullchain.pem・privkey.pem に置く(試すだけなら docs/nginx.md の自己署名の作り方)
#   3. 下の environment の値を書き換え、`docker compose -f deploy/compose.nginx.yml up -d`
#
# アプリのポート(8000)は外に公開せず、Nginx からだけ接続させる(認証・上限を Nginx を通さずに回避されないように)。

services:
  mediasearch:
    image: ghcr.io/miyabiver39/embeddinggemma-poc:cpu   # GPU を使う場合は cuda などに(docker-compose.yml を参照)
    container_name: mediasearch
    restart: unless-stopped
    stop_grace_period: 60s
    expose: ["8000"]
    environment:
      API_TOKEN: "change-me-to-a-long-random-token"   # 必ず書き換える(docs/security.md)
      ALLOWED_HOSTS: "search.example.com"              # server_name と同じ
      PUBLIC_URL: "https://search.example.com"
      MAX_UPLOAD_MB: "4096"                            # client_max_body_size と同じ
      # Nginx が付ける X-Forwarded-For / X-Forwarded-Proto を信用する。ポートを公開せず、
      # 同じネットワークの Nginx からだけ接続される前提のため、全ての送信元を許可している
      FORWARDED_ALLOW_IPS: "*"
      LOG_FORMAT: json
    volumes:
      - ../data:/data
      # - /path/to/recordings:/recordings:ro
    networks: [internal]

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/acme:/var/www/acme:ro   # Let's Encrypt の HTTP-01 の確認用(certbot の webroot)
    depends_on:
      mediasearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

networks:
  internal:
