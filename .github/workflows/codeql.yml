# CodeQL によるソースコードの静的解析(脆弱性につながる書き方の検出)。
# 結果は GitHub の Security タブ(Code scanning)に表示され、README のバッジにも反映されます。
name: codeql

# 文書(*.md)と LICENSE だけの変更では解析しない(解析の対象のコードが変わらないため。週 1 回の定期実行は行う)
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  schedule:
    - cron: "41 20 * * 0" # 毎週月曜 05:41(日本時間)。新しく追加された検出ルールで再検査する
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # 結果を Code scanning に登録するため
    strategy:
      fail-fast: false
      matrix:
        # python: アプリ本体とスクリプト / actions: GitHub Actions のワークフロー
        language: [python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: /language:${{ matrix.language }}
