# OpenSSF Scorecard: OSS としてのセキュリティ上の取り組み(ブランチ保護、依存の固定、署名など)を点数化します。
# 結果は公開され(publish_results)、README のバッジと https://scorecard.dev のページに表示されます。
# Scorecard の制約で、このワークフローには最上位の env / defaults を置けず、使える Action も限られます。
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 21 * * 2" # 毎週水曜 06:23(日本時間)
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # 結果を Code scanning に登録するため
      id-token: write # 結果の公開(publish_results)に必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
