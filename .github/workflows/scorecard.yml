# OpenSSF Scorecard: OSS としてのセキュリティ上の取り組み(ブランチ保護、依存の固定、署名など)を点数化します。
# 結果は公開され(publish_results)、README のバッジと https://scorecard.dev のページに表示されます。
# Scorecard の制約で、このワークフローには最上位の env / defaults を置けず、使える Action も限られます。
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 21 * * 2" # 毎週水曜 06:23(日本時間)
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # 結果を Code scanning に登録するため
      id-token: write # 結果の公開(publish_results)に必要
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: results.sarif
