# イメージを GitHub Actions でビルドして ghcr.io に公開します。
# 利用者は `docker pull ghcr.io/<owner>/embeddinggemma-poc:cpu` のように取得するだけです。
# タグ(v*)を push すると、版付きのイメージを公開し、SBOM と脆弱性検査の結果を添付したリリースを作ります(docs/release.md)。
name: build

# 文書(*.md)と LICENSE だけの変更では、テストもイメージのビルドも行わない(結果が変わらないため)。
# main への push はワークフローごと省く。プルリクエストでは、test ジョブだけを動かして中身の手順を省き、すぐに成功で終える
# (main のブランチ保護で test の成功を必須にしているため。ワークフローごと省くと、結果が届かずマージできなくなる)。
# タグの push には、この絞り込みは効かない(GitHub の仕様)ため、リリースでは必ずビルドする。
# テストだけに関わる変更(tests/・bench/・scripts/ など)では、テストだけ行い、イメージのビルドは省く(image ジョブの if)。
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 既定は読み取りだけ。書き込みが要るジョブだけ、ジョブごとに権限を足す
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # テストのジョブは、プルリクエストのコードも動かすため、書き込みの権限を持たせない(バッジは badges ジョブで書く)
    permissions:
      contents: read
    outputs:
      image: ${{ steps.changes.outputs.image }}
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: イメージの中身に関わる変更があるか調べる
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # イメージに入るのは src/・docker/・pyproject.toml だけ(.dockerignore)。ワークフロー自体の変更も、ビルドで確かめる。
          # 比べる元が分からないとき(タグ・手動実行・ブランチの作成)と、取得に失敗したときは、安全のためビルドする
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          else
            echo "image=true" >> "$GITHUB_OUTPUT"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git fetch -q --no-tags --depth=1 origin "$base"; then
            echo "image=true" >> "$GITHUB_OUTPUT"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          # 文書(*.md)と LICENSE 以外の変更があれば、テストを行う
          if [ -n "$(echo "$changed" | grep -vE '(\.md$|^LICENSE$)')" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "文書だけの変更のため、テストを省きます"
          fi
          if echo "$changed" | grep -qE '^(src/|docker/|pyproject\.toml$|\.dockerignore$|\.github/workflows/build\.yml$)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "イメージの中身に関わる変更が無いため、イメージのビルドを省きます"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.code == 'true'
        with:
          python-version: "3.12"
      - if: steps.changes.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: steps.changes.outputs.code == 'true'
        run: pip install -e ".[dev]"
      - if: steps.changes.outputs.code == 'true'
        run: ruff check src tests scripts bench
      - if: steps.changes.outputs.code == 'true'
        run: pytest -q -m "not model" --cov=mediasearch --cov-report=term --cov-report=json:coverage.json --junitxml=junit.xml
      - name: テストの結果を次のジョブに渡す(main への push のときだけ)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            coverage.json
            junit.xml
          retention-days: 1

  # README のバッジ(テスト件数・カバレッジ)を badges ブランチに書く。main への push のときだけ動き、
  # 書き込みの権限はこのジョブだけに持たせる(テストのコードは、この権限のもとでは動かさない)
  badges:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-results
      - name: README のバッジを更新する
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/badges.py coverage coverage.json badges/coverage.json
          python3 scripts/badges.py tests junit.xml badges/tests.json
          python3 scripts/badges.py publish badges --message "テスト件数とカバレッジを更新(${GITHUB_SHA::7})"

  image:
    needs: test
    if: needs.test.outputs.image == 'true' && needs.test.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, cpu, cuda, rocm, intel]
    steps:
      - name: ディスクを空ける(GPU 系イメージは巨大なため)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.variant }},enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ matrix.variant == 'cpu' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}-${{ matrix.variant }}
            type=sha,prefix=sha-,suffix=-${{ matrix.variant }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            VARIANT=${{ matrix.variant }}
            MEDIASEARCH_REVISION=${{ github.sha }}
            MEDIASEARCH_BUILD_REF=${{ github.ref_name }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  # タグ(v*)のときだけ: 公開したイメージの SBOM と脆弱性検査の結果を、リリースに添付する
  security:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/security.yml
    with:
      tag: ${{ github.ref_name }}
      release: true
