# イメージを GitHub Actions でビルドして ghcr.io に公開します。
# 利用者は `docker pull ghcr.io/<owner>/embeddinggemma-poc:cpu` のように取得するだけです。
# タグ(v*)を push すると、版付きのイメージを公開し、SBOM と脆弱性検査の結果を添付したリリースを作ります(docs/release.md)。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q -m "not model"

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, cpu, cuda, rocm, intel]
    steps:
      - name: ディスクを空ける(GPU 系イメージは巨大なため)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.variant }},enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ matrix.variant == 'cpu' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}-${{ matrix.variant }}
            type=sha,prefix=sha-,suffix=-${{ matrix.variant }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            VARIANT=${{ matrix.variant }}
            VMSEMBED_REVISION=${{ github.sha }}
            VMSEMBED_BUILD_REF=${{ github.ref_name }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  # タグ(v*)のときだけ: 公開したイメージの SBOM と脆弱性検査の結果を、リリースに添付する
  security:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/security.yml
    with:
      tag: ${{ github.ref_name }}
      release: true
