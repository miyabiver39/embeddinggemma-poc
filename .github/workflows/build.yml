# イメージを GitHub Actions でビルドして ghcr.io に公開します。
# 利用者は `docker pull ghcr.io/<owner>/embeddinggemma-poc:cpu` のように取得するだけです。
# タグ(v*)を push すると、版付きのイメージを公開し、SBOM と脆弱性検査の結果を添付したリリースを作ります(docs/release.md)。
name: build

# 文書(*.md)と LICENSE だけの変更では、テストもイメージのビルドも行わない(結果が変わらないため)。
# タグの push には、この絞り込みは効かない(GitHub の仕様)ため、リリースでは必ずビルドする。
# テストだけに関わる変更(tests/・bench/・scripts/ など)では、テストだけ行い、イメージのビルドは省く(image ジョブの if)。
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # main への push 時に、README のバッジ(テスト件数・カバレッジ)を badges ブランチに書くため
    outputs:
      image: ${{ steps.changes.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: イメージの中身に関わる変更があるか調べる
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # イメージに入るのは src/・docker/・pyproject.toml だけ(.dockerignore)。ワークフロー自体の変更も、ビルドで確かめる。
          # 比べる元が分からないとき(タグ・手動実行・ブランチの作成)と、取得に失敗したときは、安全のためビルドする
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          else
            echo "image=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git fetch -q --no-tags --depth=1 origin "$base"; then
            echo "image=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/|docker/|pyproject\.toml$|\.dockerignore$|\.github/workflows/build\.yml$)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "イメージの中身に関わる変更が無いため、イメージのビルドを省きます"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts bench
      - run: pytest -q -m "not model" --cov=mediasearch --cov-report=term --cov-report=json:coverage.json --junitxml=junit.xml
      - name: README のバッジを更新する(main への push のときだけ)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/badges.py coverage coverage.json badges/coverage.json
          python3 scripts/badges.py tests junit.xml badges/tests.json
          python3 scripts/badges.py publish badges --message "テスト件数とカバレッジを更新(${GITHUB_SHA::7})"

  image:
    needs: test
    if: needs.test.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, cpu, cuda, rocm, intel]
    steps:
      - name: ディスクを空ける(GPU 系イメージは巨大なため)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.variant }},enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ matrix.variant == 'cpu' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}-${{ matrix.variant }}
            type=sha,prefix=sha-,suffix=-${{ matrix.variant }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            VARIANT=${{ matrix.variant }}
            MEDIASEARCH_REVISION=${{ github.sha }}
            MEDIASEARCH_BUILD_REF=${{ github.ref_name }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  # タグ(v*)のときだけ: 公開したイメージの SBOM と脆弱性検査の結果を、リリースに添付する
  security:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/security.yml
    with:
      tag: ${{ github.ref_name }}
      release: true
