# 依存関係の更新(脆弱性の修正を含む)を、週に 1 回まとめて提案させます。
# PyTorch と transformers は動作確認した版に固定しているため(AGENTS.md)、提案があっても取り込む前に確認してください。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    # ベースの Ubuntu は LTS(24.04)に固定する。同じ版の中の更新(digest。セキュリティ修正を含む)だけを提案させる。
    # 版を上げるとき(次の LTS など)は、GPU 版の動作確認とあわせて手で行う
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
